<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify NFC Setup</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
      background: #111;
      color: white;
    }

    button {
      background: #1DB954;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      text-align: left;
      word-break: break-all;
    }

    .token {
      background: #222;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <h1>🎵 Spotify NFC Player</h1>

  <p id="message">Connect your Spotify account.</p>

  <button id="login">Connect Spotify</button>

  <div id="result"></div>

<script>

const clientId = "a4d302f72ad14af8a4ce22e1caf2fcce";

const redirectUri =
  "https://nikhilchopra27.github.io/spotify-nfc/";

const scopes =
  "user-library-read user-read-playback-state user-modify-playback-state";


// ---------- PKCE FUNCTIONS ----------

function randomString(length) {

  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  const values = new Uint8Array(length);
  crypto.getRandomValues(values);

  for (let i = 0; i < length; i++) {
    result += characters[values[i] % characters.length];
  }

  return result;
}


async function generateChallenge(verifier) {

  const data = new TextEncoder().encode(verifier);

  const digest =
    await crypto.subtle.digest("SHA-256", data);

  const bytes = new Uint8Array(digest);

  let binary = "";

  bytes.forEach(byte => {
    binary += String.fromCharCode(byte);
  });

  return btoa(binary)
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}


// ---------- LOGIN ----------

document.getElementById("login").onclick = async function () {

  const verifier = randomString(64);

  const challenge =
    await generateChallenge(verifier);

  const state =
    randomString(32);

  localStorage.setItem(
    "spotify_code_verifier",
    verifier
  );

  localStorage.setItem(
    "spotify_state",
    state
  );

  const params = new URLSearchParams({

    client_id: clientId,

    response_type: "code",

    redirect_uri: redirectUri,

    scope: scopes,

    code_challenge_method: "S256",

    code_challenge: challenge,

    state: state

  });

  window.location.href =
    "https://accounts.spotify.com/authorize?" +
    params.toString();

};


// ---------- CALLBACK ----------

async function handleCallback() {

  const params =
    new URLSearchParams(window.location.search);

  const code =
    params.get("code");

  const returnedState =
    params.get("state");

  const error =
    params.get("error");


  if (error) {

    document.getElementById("message").textContent =
      "Spotify authorization failed: " + error;

    return;
  }


  if (!code) return;


  const savedState =
    localStorage.getItem("spotify_state");

  if (returnedState !== savedState) {

    document.getElementById("message").textContent =
      "Security check failed. Please try again.";

    return;
  }


  const verifier =
    localStorage.getItem("spotify_code_verifier");


  document.getElementById("message").textContent =
    "Connecting to Spotify...";


  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body: new URLSearchParams({

          client_id: clientId,

          grant_type:
            "authorization_code",

          code: code,

          redirect_uri:
            redirectUri,

          code_verifier:
            verifier

        })

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    document.getElementById("message").textContent =
      "Spotify error.";

    document.getElementById("result").textContent =
      JSON.stringify(data, null, 2);

    return;
  }


  // Save tokens locally

  localStorage.setItem(
    "spotify_access_token",
    data.access_token
  );


  if (data.refresh_token) {

    localStorage.setItem(
      "spotify_refresh_token",
      data.refresh_token
    );

  }


  document.getElementById("message").textContent =
    "✅ Spotify connected!";


  document.getElementById("result").innerHTML = `

    <p><strong>Your Refresh Token:</strong></p>

    <div class="token">
      ${data.refresh_token || "No refresh token returned"}
    </div>

    <p>
      Copy this refresh token and keep it private.
      We'll put it into your iPhone Shortcut.
    </p>

  `;


  // Clean the URL

  window.history.replaceState(
    {},
    document.title,
    redirectUri
  );

}


handleCallback();

</script>

</body>
</html>
